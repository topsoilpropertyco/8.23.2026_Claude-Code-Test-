name: Sleep OS Dispatch

# The engine polls every 5 minutes and sends any slot whose jittered target
# time has passed. After sending, it holds an open long poll for most of the
# remaining interval so a reply is answered within seconds rather than at the
# next run -- see src/listen.js for why that beats standing up a webhook. Polling rather than scheduling six exact crons is deliberate:
# GitHub's scheduler routinely fires several minutes late, and a poll absorbs
# that drift instead of compounding it. The schedule itself is computed
# deterministically from the date, so extra polls never move the target times.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Force a specific slot (e.g. work_shutdown). Leave blank to send whatever is due.'
        required: false
        type: string
      dry_run:
        description: 'Render without sending'
        required: false
        type: boolean
        default: false
      oura_action:
        description: 'Oura setup: "url" prints the authorisation link, "code" exchanges the code below'
        required: false
        type: choice
        options: ['', 'url', 'code']
        default: ''
      oura_code:
        description: 'Authorisation code from the redirect URL (only with oura_action=code)'
        required: false
        type: string
      send_deck:
        description: 'Send the swipeable deck now, even if tonight''s data has not changed'
        required: false
        type: boolean
        default: false
      deck_date:
        description: 'Which night the deck should show (YYYY-MM-DD). Blank = the latest on record.'
        required: false
        type: string

concurrency:
  group: sleep-os-dispatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Oura authorisation
        if: inputs.oura_action != ''
        env:
          SLEEPOS_DATA_KEY: ${{ secrets.SLEEPOS_DATA_KEY }}
          OURA_CLIENT_ID: ${{ secrets.SLEEPOS_OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.SLEEPOS_OURA_CLIENT_SECRET }}
        run: node bin/sleep-os.js oura ${{ inputs.oura_action }} "${{ inputs.oura_code }}"

      - name: Dispatch due reminders
        if: inputs.oura_action == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SLEEPOS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SLEEPOS_TELEGRAM_CHAT_ID }}
          SLEEPOS_DATA_KEY: ${{ secrets.SLEEPOS_DATA_KEY }}
          OURA_CLIENT_ID: ${{ secrets.SLEEPOS_OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.SLEEPOS_OURA_CLIENT_SECRET }}
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            node bin/sleep-os.js send "${{ inputs.slot }}" ${{ inputs.dry_run && '--dry-run' || '' }}
          else
            node bin/sleep-os.js dispatch ${{ inputs.dry_run && '--dry-run' || '' }}
          fi

      # The last-night screen is rebuilt only when the ingest actually wrote a
      # new night, not on all 144 daily polls. It embeds real biometrics, so on
      # a public repo it must never be committed -- it leaves as a private
      # workflow artifact instead. continue-on-error because a broken screen
      # must never stop the reminders going out.
      - name: Did telemetry change?
        if: inputs.oura_action == ''
        id: telem
        run: |
          if [ -n "$(git status --porcelain state/telemetry.enc)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The grade table has to be counted, not fitted, and only the runner can
      # read the encrypted history. Rebuilding here replaces every modelled row
      # with a census of real nights, then --check fails loudly if the key was
      # missing and the output is still provisional.
      - name: Rebuild the grade table from real nights
        if: >-
          inputs.oura_action == ''
          && (steps.telem.outputs.changed == 'true' || inputs.send_deck == true)
        continue-on-error: true
        env:
          SLEEPOS_DATA_KEY: ${{ secrets.SLEEPOS_DATA_KEY }}
        run: |
          node bin/build-night-data.mjs
          node bin/build-grades.mjs --check
          python3 bin/build-screens.py
          python3 bin/build-deck.py

      - name: Upload the grade table
        if: >-
          inputs.oura_action == ''
          && (steps.telem.outputs.changed == 'true' || inputs.send_deck == true)
        uses: actions/upload-artifact@v4
        with:
          name: grade-table
          path: |
            references/08-MY-SCORE-TABLE.md
            data/my-score-table.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Build the last-night screen
        if: inputs.oura_action == '' && steps.telem.outputs.changed == 'true'
        continue-on-error: true
        env:
          SLEEPOS_DATA_KEY: ${{ secrets.SLEEPOS_DATA_KEY }}
        run: node web/build-night.js

      - name: Upload the last-night screen
        if: inputs.oura_action == '' && steps.telem.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: last-night
          path: web/night.html
          retention-days: 14
          if-no-files-found: ignore

      # Phase 8. The screen was correct and unreachable -- it left as a workflow
      # artifact, which meant opening Actions and downloading a zip. A photo in
      # the chat that already carries everything else costs one message.
      # CHROMIUM_PATH points at the runner's preinstalled Chrome so this does
      # not download a browser on every run.
      - name: Send the last-night screen
        if: inputs.oura_action == '' && steps.telem.outputs.changed == 'true' && inputs.dry_run != true
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SLEEPOS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SLEEPOS_TELEGRAM_CHAT_ID }}
          SLEEPOS_DATA_KEY: ${{ secrets.SLEEPOS_DATA_KEY }}
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save --silent playwright-core
          node bin/sleep-os.js night

      # The deck used to ship as a link to a published artifact, which is a
      # photograph: nothing in a scheduled run can republish it, so it froze on
      # whatever night it was built from and drifted from every message after.
      # An album is re-rendered from telemetry at send time, so there is no
      # artefact left to go stale, and it stays inside a private chat -- which a
      # Pages site could not, this repository being public.
      - name: Send the swipeable deck
        if: >-
          inputs.oura_action == '' && inputs.dry_run != true
          && (steps.telem.outputs.changed == 'true' || inputs.send_deck == true)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SLEEPOS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SLEEPOS_TELEGRAM_CHAT_ID }}
          SLEEPOS_DATA_KEY: ${{ secrets.SLEEPOS_DATA_KEY }}
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save --silent playwright-core
          node bin/send-deck.mjs ${{ inputs.deck_date }}

      # Hold an open long poll for most of what is left of the interval. Runs
      # last so a slow or failing poll can never delay a scheduled send, and
      # continue-on-error so it can never fail the run that already delivered.
      - name: Listen for replies
        if: inputs.oura_action == '' && inputs.dry_run != true
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SLEEPOS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SLEEPOS_TELEGRAM_CHAT_ID }}
          SLEEPOS_DATA_KEY: ${{ secrets.SLEEPOS_DATA_KEY }}
        run: node bin/sleep-os.js listen 200

      - name: Persist rotation state
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "sleep-os[bot]"
          git config user.email "sleep-os@users.noreply.github.com"
          git add state/
          git commit -m "chore(state): rotation update $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another push may have landed while this run was working. Rebase onto
          # it; if the state files themselves conflict, ours win -- this run is
          # the one that knows what was just delivered, and losing that record
          # would make the next run re-send the same card.
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              if git checkout --ours -- state/ 2>/dev/null; then
                git add state/
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              else
                git rebase --abort || true
              fi
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((2 ** attempt))
          done
          echo "::error::Could not persist rotation state after 4 attempts."
          exit 1
